<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="description" content="Cats and breeds"/>
        <meta name="keywords" content="RPG"/>
        <meta name="author" content="Michał Warmbier"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Cats</title>

        <h:outputStylesheet library="webjars" name="mdb-ui-kit/6.4.0/css/mdb.min.css"/>
        <h:outputStylesheet library="default" name="css/main.css"/>
        <h:outputScript library="webjars" name="mdb-ui-kit/6.4.0/js/mdb.min.js"/>
        <h:outputScript library="mdb" name="js/main.js" target="body"/>
    </h:head>

    <h:body>
        <div class="container">
            <header class="mb-4 mt-4">
                <h:graphicImage style="width: 200px; object-fit: cover; height: 200px;"  class="me-3" value="https://img.freepik.com/free-photo/cute-cats-relaxing-indoors_23-2150692683.jpg"/>
                <h1>#{msg['title.app']}</h1>
                <h:form>
                    <h:selectOneMenu value="#{localeSwitcher.language}" onchange="submit()">
                        <f:selectItem itemValue="en" itemLabel="#{msg['language.english']}"/>
                        <f:selectItem itemValue="pl" itemLabel="#{msg['language.polish']}"/>
                        <f:ajax listener="#{localeSwitcher.changeLocale(localeSwitcher.language)}" />
                    </h:selectOneMenu>
                </h:form>

                <h:form styleClass="container d-flex  align-items-center justify-content-end"
                        rendered="#{facesContext.externalContext.userPrincipal != null}">
                    Logged: <h:outputText value="#{facesContext.externalContext.userPrincipal.name}"/>
                    <h:commandButton styleClass="btn btn-link" value="Logout"
                                     action="#{ownerLogout.logoutAction()}"/>
                </h:form>

                <h:form styleClass="container d-flex  align-items-center justify-content-end"
                        rendered="#{facesContext.externalContext.userPrincipal == null}">
                    <h:link styleClass="nav-link"
                            outcome="/authentication/custom/login.xhtml">#{msg['title.login']}</h:link>
                </h:form>
            </header>

            <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
                <div class="container-fluid">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <h:link styleClass="nav-link" outcome="/index.xhtml">Home</h:link>
                        </li>
                        <li class="nav-item">
                            <h:link styleClass="nav-link"
                                    outcome="/breed/breed_list.xhtml">#{msg['title.breeds']}</h:link>
                        </li>
                        <h:panelGroup rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                            <li class="nav-item">
                                <h:link styleClass="nav-link"
                                        outcome="/owner/owner_list.xhtml">#{msg['title.owners']}</h:link>
                            </li>
                        </h:panelGroup>
                    </ul>
                </div>
            </nav>

            <main class="mb-4 mt-4">
                <ui:insert name="content"/>
            </main>

            <footer class="text-center text-lg-start bg-light text-muted p-2">
                <div class="text-center">
                    Michał Warmbier 188889
                </div>
                <div class="text-center">
                    #{msg['title.footer']}
                </div>
            </footer>
        </div>
    </h:body>
</f:view>
</html>
