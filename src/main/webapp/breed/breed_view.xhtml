<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{breedView.id}" required="true"/>
        <f:viewAction action="#{breedView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header>
                <h2>
                    <h:outputText value="#{breedView.breed.name}"/>
                </h2>
            </header>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6">
                                Average Lifespan
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{breedView.breed.averageLifespan}"/>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-6">
                                Hypoallergenic:
                            </div>
                            <div class="col-6">
                                <h:outputText value="#{breedView.breed.hypoallergenic}"/>
                            </div>
                        </div>
                    </div>

                </div>

                <h:dataTable value="#{breedView.cats.cats}" var="cat"
                             styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        <h:outputText value="#{cat.name}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">View</f:facet>
                        <h:link outcome="/cat/cat_view.xhtml" value="View">
                            <f:param name="id" value="#{cat.id}"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Edit</f:facet>
                        <h:link outcome="/cat/cat_edit.xhtml" value="Edit">
                            <f:param name="id" value="#{cat.id}"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Delete</f:facet>
                        <h:form>
                            <h:commandButton styleClass="btn" value="Delete"
                                             action="#{breedView.deleteCat(cat)}"/>
                        </h:form>
                    </h:column>

<!--                    <f:facet name="footer">-->
<!--                        <h:button styleClass="btn" outcome="/weapontype/weapontype_create__basic.xhtml"-->
<!--                                  value="Create new weapontype"/>-->
<!--                    </f:facet>-->
                </h:dataTable>

            </div>
        </article>
    </ui:define>

</ui:composition>
