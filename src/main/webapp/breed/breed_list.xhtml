<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="breed" name="css/breed.css"/><!-- Automatically relocated to head. -->

        <article class="text--justified">
            <header><h2>#{msg['title.breeds']}</h2></header>
            <h:dataTable id="breedTable" value="#{breedList.breeds.breeds}" var="breed"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">#{msg['cat.view.name']}</f:facet>
                    <h:outputText value="#{breed.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg['button.view']}</f:facet>
                    <h:link outcome="/breed/breed_view.xhtml" value="#{msg['button.view']}">
                        <f:param name="id" value="#{breed.id}"/>
                    </h:link>
                </h:column>

                <h:column rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                    <f:facet name="header">#{msg['button.delete']}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{msg['button.delete']}"
                                         action="breedList.deleteAction()">
                            <f:ajax execute="@this" render=":breedTable"/>
                        </h:commandButton>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/cat/cat_create.xhtml"
                              value="#{msg['cat.addnew']}"/>

                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
