<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core" xmlns:c="http://java.sun.com/jsp/jstl/core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{catCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create cat - basic information</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="name" value="#{catCreate.cat.name}" styleClass="form-control"/>
                            <h:outputLabel for="name" value="Name:" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:selectOneMenu styleClass="form-select" id="color" value="#{catCreate.cat.color}">
                                <f:selectItems value="#{catCreate.catColors}" />
                            </h:selectOneMenu>
                        </div>
                    </div>
                </div>


                <div class="row">
                    <div class="col-4 p-2">
                        <div class="form-outline">
                            <h:inputText id="weight" value="#{catCreate.cat.weight}" styleClass="form-control"/>
                            <h:outputLabel for="weight" value="Weight:" styleClass="form-label"/>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <h:outputLabel value="Breed:" styleClass="form-label" />
                        <h:selectOneRadio value="#{catCreate.cat.breed}" layout="pageDirection">
                            <f:selectItems value="#{catCreate.breeds}" var="breed"
                                           itemLabel="#{breed.name}" itemValue="#{breed}" />
                        </h:selectOneRadio>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-primary" value="Create" action="#{catCreate.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="Cancel"
                                         action="#{catCreate.cancelAction()}"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
